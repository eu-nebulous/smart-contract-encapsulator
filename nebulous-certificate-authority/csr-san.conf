[ req ]
default_bits       = 2048
distinguished_name = dn
req_extensions     = ext
prompt             = no
default_md         = sha256

[ dn ]
C = US
ST = State
L = City
O = MyOrg
OU = OrgUnit

[ ext ]
subjectAltName = @alt_names

[ alt_names ]
DNS.1 = PLACEHOLDER
DNS.2 = PLACEHOLDER_FQDN
DNS.3 = localhost
IP.1  = 127.0.0.1
