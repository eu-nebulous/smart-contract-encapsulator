################################################################################
#
#   Section: Organizations
#
#   - This section defines the different organizational identities which will
#   be referenced later in the configuration.
#
################################################################################
Organizations:

  - &OrdererOrg
    # Name of the organization
    Name: OrdererOrg
    # ID to load the MSP definition as
    ID: OrdererOrgMSP
    # MSPDir is the filesystem path which contains the MSP configuration
    MSPDir: ../nebulous-certificate-authority/organizations/ordererOrganizations/neb.com/msp

    # Policies defines the set of policies for this organization.
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererOrgMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererOrgMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererOrgMSP.admin')"
    # OrdererEndpoints is the modern way to list the orderers of an organization.
    OrdererEndpoints:
      - orderer.neb.com:7050

  - &BrokerOrg
    Name: BrokerOrgMSP
    ID: BrokerOrgMSP
    MSPDir: ../nebulous-certificate-authority/organizations/peerOrganizations/brokerorg.neb.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('BrokerOrgMSP.admin', 'BrokerOrgMSP.peer', 'BrokerOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('BrokerOrgMSP.admin', 'BrokerOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('BrokerOrgMSP.admin')"
      # Endorsement policy for this organization, specifying a peer is required.
      Endorsement:
        Type: Signature
        Rule: "OR('BrokerOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.brokerorg.neb.com
        Port: 7051

  - &ResourceProviderOrg
    Name: ResourceProviderOrgMSP
    ID: ResourceProviderOrgMSP
    MSPDir: ../nebulous-certificate-authority/organizations/peerOrganizations/resourceproviderorg.neb.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ResourceProviderOrgMSP.admin', 'ResourceProviderOrgMSP.peer', 'ResourceProviderOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ResourceProviderOrgMSP.admin', 'ResourceProviderOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ResourceProviderOrgMSP.admin')"
      # Endorsement policy for this organization, specifying a peer is required.
      Endorsement:
        Type: Signature
        Rule: "OR('ResourceProviderOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.resourceproviderorg.neb.com
        Port: 9051

################################################################################
#
#   SECTION: Capabilities
#
#   - This section defines the capabilities of the fabric network.
#
################################################################################
Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    # V2_5 for Application enables the new non-backwards compatible
    # features of fabric v2.5. Ensure all peers on a channel are at v2.5.0 or later.
    V2_5: true

################################################################################
#
#   SECTION: Application
#
#   - This section defines the values to encode into a config transaction or
#   genesis block for application-related parameters.
#
################################################################################
Application: &ApplicationDefaults
  ACLs: &ACLsDefault
    
    # ACL policy for lscc's "getid" function
    lscc/ChaincodeExists: /Channel/Application/Readers

    # ACL policy for lscc's "getdepspec" function
    lscc/GetDeploymentSpec: /Channel/Application/Readers

    # ACL policy for lscc's "getccdata" function
    lscc/GetChaincodeData: /Channel/Application/Readers

    # ACL Policy for lscc's "getchaincodes" function
    lscc/GetInstantiatedChaincodes: /Channel/Application/Readers
    

    #---Query System Chaincode (qscc) function to policy mapping for access control---#

    # ACL policy for qscc's "GetChainInfo" function
    qscc/GetChainInfo: /Channel/Application/Readers
    

    # ACL policy for qscc's "GetBlockByNumber" function
    qscc/GetBlockByNumber: /Channel/Application/Readers

    # ACL policy for qscc's  "GetBlockByHash" function
    qscc/GetBlockByHash: /Channel/Application/Readers

    # ACL policy for qscc's "GetTransactionByID" function
    qscc/GetTransactionByID: /Channel/Application/Readers

    # ACL policy for qscc's "GetBlockByTxID" function
    qscc/GetBlockByTxID: /Channel/Application/Readers

    #---Configuration System Chaincode (cscc) function to policy mapping for access control---#

    # ACL policy for cscc's "GetConfigBlock" function
    cscc/GetConfigBlock: /Channel/Application/Readers

    # ACL policy for cscc's "GetConfigTree" function
    cscc/GetConfigTree: /Channel/Application/Readers

    # ACL policy for cscc's "SimulateConfigTreeUpdate" function
    cscc/SimulateConfigTreeUpdate: /Channel/Application/Readers

    #---Miscellanesous peer function to policy mapping for access control---#

    # ACL policy for invoking chaincodes on peer
    peer/Propose: /Channel/Application/Writers

    # ACL policy for chaincode to chaincode invocation
    peer/ChaincodeToChaincode: /Channel/Application/Readers

    #---Events resource to policy mapping for access control###---#

    # ACL policy for sending block events
    event/Block: /Channel/Application/Readers

    # ACL policy for sending filtered block events
    event/FilteredBlock: /Channel/Application/Readers

    # Chaincode Lifecycle Policies introduced in Fabric 2.x
    # ACL policy for _lifecycle's "CheckCommitReadiness" function
    _lifecycle/CheckCommitReadiness: /Channel/Application/Writers

    # ACL policy for _lifecycle's "CommitChaincodeDefinition" function
    _lifecycle/CommitChaincodeDefinition: /Channel/Application/Writers

    # ACL policy for _lifecycle's "QueryChaincodeDefinition" function
    _lifecycle/QueryChaincodeDefinition: /Channel/Application/Readers

  Organizations:
  # Policies defines the set of policies at the application level of the config tree.
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

################################################################################
#
#   SECTION: Orderer
#
#   - This section defines the values to encode into a config transaction or
#   genesis block for orderer-related parameters.
#
################################################################################
Orderer: &OrdererDefaults
  # Orderer Type: The consensus algorithm used by the ordering service.
  OrdererType: etcdraft
  # EtcdRaft defines the configuration for an etcd/raft-based ordering service.
  EtcdRaft:
    Consenters:
      - Host: orderer.neb.com
        Port: 7050
        ClientTLSCert: ../nebulous-certificate-authority/organizations/ordererOrganizations/neb.com/orderers/orderer.neb.com/tls/server.crt
        ServerTLSCert: ../nebulous-certificate-authority/organizations/ordererOrganizations/neb.com/orderers/orderer.neb.com/tls/server.crt
  # Batch Timeout: The amount of time to wait before creating a batch.
  BatchTimeout: 2s
  # Batch Size: Controls the number of messages batched into a block.
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  # Policies defines the set of policies at the orderer level of the config tree.
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

################################################################################
#
#   CHANNEL
#
#   This section defines the values to encode into a config transaction or
#   genesis block for channel-related parameters.
#
################################################################################
Channel: &ChannelDefaults
  # Policies defines the set of policies at the channel level of the config tree.
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

################################################################################
#
#   Profile
#
#   - Different configuration profiles may be encoded here to be specified
#   as parameters to the configtxgen tool.
#
################################################################################
Profiles:
  # TwoOrgEtcdRaft defines the profile for the system channel genesis block.
  TwoOrgEtcdRaft:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Consortiums:
      SampleConsortium:
        Organizations:
          - *BrokerOrg
          - *ResourceProviderOrg
    Capabilities:
      <<: *ChannelCapabilities

  # TwoOrgChannel defines the profile for the application channel transaction.
  TwoOrgChannel:
    Consortium: SampleConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *BrokerOrg
        - *ResourceProviderOrg
    Capabilities:
      <<: *ApplicationCapabilities